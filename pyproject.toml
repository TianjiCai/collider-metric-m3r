[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m3r"
version = "1.0.0"
description = "Multi-reference relative representations (M3R) of collider event metrics: companion code for 'A Unified Geometric Framework for Understanding Collider Event Manifolds'"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Tianji Cai" },
  { name = "Hancheng Li" },
]
keywords = ["jet physics", "optimal transport", "metric spaces", "JetClass"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.5,<1.7",
  "POT>=0.9.4",
  "matplotlib>=3.8",
  "mplhep>=0.3",
  "pyyaml>=6",
  "tqdm>=4.60",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
]

[project.optional-dependencies]
# Tier 3 data generation from raw JetClass ROOT files
gen = [
  "uproot>=5",
  "awkward>=2",
  "vector>=1",
  "pyarrow>=14",
  "pandas>=2",
  "fastjet>=3.4",
  "energyflow>=1.3",
]
# Spectral 2-Wasserstein distances through SPECTER (JAX). specterpy 1.1.0 imports
# jax.tree_map, removed in JAX 0.6; m3r.metrics.sw installs a shim and this pin is a fallback.
sw = [
  "jax<0.6",
  "jaxlib<0.6",
  "specterpy>=1.1",
]
# Multi-tower MLP robustness check (Sec. 6 footnote) and the other NN experiments
nn = ["torch>=2.2"]

[project.urls]
Repository = "https://github.com/TianjiCai/collider-metric-comparison"

[tool.setuptools.packages.find]
include = ["m3r*", "experiments*"]
