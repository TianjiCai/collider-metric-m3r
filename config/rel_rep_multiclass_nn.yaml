defaults:
  - default
  - nn
  - _self_

run_name: "rel_rep_multiclass_nn"
experiment: "RelRepMulticlassNN"

anchor_per_class: 100
data_path: rel_rep_data/${metric}/

include_kin: true
include_part_ids: false
num_ids: 6

kin_dim: ${mul:${mul:${n_classes},${anchor_per_class}},${include_kin}}
part_id_dim: ${mul:${mul:${mul:${num_ids},${anchor_per_class}},${n_classes}},${include_part_ids}}

# network:
#   input_dim: ${add:${kin_dim},${part_id_dim}}

network:
  kin_dim: ${kin_dim}
  part_id_dim: ${part_id_dim}

hydra:
  run:
    dir: runs/${run_name}/${metric}/${dataset_size}/${now:%Y-%m-%d_%H-%M-%S}