_target_: utils.nn_utils.TwoTowerMLP

# tower input dims
kin_dim: ${mul:${mul:2,${anchor_per_class}},${include_kin}}
part_id_dim: ${mul:${mul:${mul:${num_ids}, ${anchor_per_class}},2},${include_part_ids}}
# kin_dim: ???
# part_id_dim: ???

# tower widths: anchor_per_class=100
# kin_hidden_dims: [2048, 1024, 512]
# part_hidden_dims: [4096, 2048, 512]

# tower widths: anchor_per_class=50
kin_hidden_dims: [1024, 512, 256]
part_hidden_dims: [2048, 1024, 256]

# fusion head
# fusion input dim: anchor_per_class=100
# fusion_hidden_dims: [512, 256]

# fusion input dim: anchor_per_class=50
fusion_hidden_dims: [256, 128]
output_dim: ${n_classes}

activation: relu
dropout: 0.0