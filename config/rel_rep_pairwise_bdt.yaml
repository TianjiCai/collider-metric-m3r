run_name: rel_rep_pairwise_bdt
experiment: RelRepPairwiseBDT

defaults:
  - default
  - _self_

anchor_per_class: 20
data_path: data/dist_mat/
seed: 42
part_ids_path: data/${dataset_size}_dataset/

val_size: 0.2
plot_only: false

metrics:
  - w2
  # - sw
  - ps
  - part_charge
  - part_isElectron
  - part_isMuon
  - part_isPhoton
  - part_isChargedHadron
  - part_isNeutralHadron

bdt:
  learning_rate: 0.05
  max_iter: 2000          # use early stopping
  max_leaf_nodes: 31
  min_samples_leaf: 50    # try 20, 50, 100
  l2_regularization: 1.0  # try 1, 5, 10
  max_bins: 255
  early_stopping: True
  validation_fraction: 0.1
  n_iter_no_change: 20

hydra:
  run:
    dir: runs/${run_name}/${metrics}/${now:%Y-%m-%d_%H-%M-%S}
