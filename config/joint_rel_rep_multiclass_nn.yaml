run_name: joint_rel_rep_multiclass_nn
experiment: JointRelRepMulticlassNN

num_metric: 2
metric_1: "w2"
metric_2: "sw"
metric_3: null

metric_2_scaling: 2

data_path_1: rel_rep_data/${metric_1}/
data_path_2: rel_rep_data/${metric_2}/

include_kin: true
include_part_ids: false
num_ids: 6

kin_dim: ${mul:${mul:${n_classes},${anchor_per_class}},${include_kin}}
part_id_dim: ${mul:${mul:${mul:${num_ids},${anchor_per_class}},${n_classes}},${include_part_ids}}

rel_rep_multiclass_nn:
  # center: false
  network:
    input_dim: ${mul:${mul:${n_classes},${rel_rep_multiclass_nn.anchor_per_class}},${num_metric}}

defaults:
  - default
  - _self_

hydra:
  run:
    dir: runs/${run_name}/${metric_1}_${metric_2}/${now:%Y-%m-%d_%H-%M-%S}

plot_only: false