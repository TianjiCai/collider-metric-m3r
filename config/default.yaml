defaults:
  - project_path
  - _self_

prev_exp_dir: null

metric: "w2"
dataset_size: "large"
n_classes: 8

hydra:
  run:
    dir: runs/${run_name}/${metric}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${hydra.run.dir}
  job_logging:
    disable_existing_loggers: false    
    formatters:
      simple:
        format: "[%(levelname)-1.1s] %(message)s"
        datefmt: "%H:%M:%S"