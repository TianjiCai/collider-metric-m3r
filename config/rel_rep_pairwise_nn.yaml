run_name: rel_rep_pairwise_nn
experiment: RelRepPairwiseNN

defaults:
  - default
  - nn
  - _self_

anchor_per_class: 100
data_path: data/dist_mat/
seed: 42
include_kin: true
include_part_ids: false
part_ids_path: data/${dataset_size}_dataset/
num_ids: 6

plot_only: false

kin_dim: ${mul:${mul:2,${anchor_per_class}},${include_kin}}
part_id_dim: ${mul:${mul:${mul:${num_ids}, ${anchor_per_class}},2},${include_part_ids}}

hydra:
  run:
    dir: runs/${run_name}/${metric}/${now:%Y-%m-%d_%H-%M-%S}