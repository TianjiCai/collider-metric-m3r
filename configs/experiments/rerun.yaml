# Re-plot (or re-run) a previous output directory in place:
#   python main.py -cn rerun prev_exp_dir=results/experiments/rel_rep_pairwise_svm/fixed/w2/a20
run_name: rerun
prev_exp_dir: ???
plot_only: true

hydra:
  output_subdir: null
  run:
    dir: ${prev_exp_dir}
  sweep:
    dir: .
  job_logging:
    formatters:
      simple:
        format: "[%(asctime)s %(levelname)-1.1s][RERUN] %(message)s"

defaults:
  - default
  - _self_
